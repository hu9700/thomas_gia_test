<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIA Mock Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef1f6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #1f2937;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 40px 48px;
    max-width: 640px;
    width: 100%;
    text-align: center;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #6b7280; margin-bottom: 32px; font-size: 15px; }
  .tasks { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  a.task {
    display: block;
    text-decoration: none;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 28px 32px;
    width: 240px;
    color: #1f2937;
    transition: all .15s ease;
  }
  a.task:hover { border-color: #2563eb; background: #eff6ff; transform: translateY(-2px); }
  a.task .num {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    margin-bottom: 12px;
  }
  a.task h2 { font-size: 18px; margin-bottom: 8px; }
  a.task p { font-size: 13px; color: #6b7280; line-height: 1.4; }
</style>
</head>
<body>
  <div class="card">
    <h1>GIA Mock Test</h1>
    <p class="subtitle">Thomas International GIA — practice tasks (mock). Select a task to begin.</p>
    <div class="tasks">
      <a class="task" href="task2.html">
        <span class="num">Task 2</span>
        <h2>Perceptual Speed</h2>
        <p>Count how many letter pairs match.</p>
      </a>
      <a class="task" href="task3.html">
        <span class="num">Task 3</span>
        <h2>Number Speed &amp; Accuracy</h2>
        <p>Find the number furthest from the middle.</p>
      </a>
    </div>
  </div>
</body>
</html>
